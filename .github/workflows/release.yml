name: Release

# Спрацьовує при пуші тегу vX.Y.Z. NyxilumNode сам не містить вихідного
# коду мови (він в NyxilumLang, NyxilumDb — окремі репозиторії) — тому
# щоразу заново чекаутить обидва як сусідів (NyxilumLang.csproj
# посилається на NyxilumDb відносним шляхом "../../../NyxilumDb/...") і
# публікує self-contained однофайлові бінарники під усі три ОС. Досі це
# робилось вручну "коли згадаю" — звідси реліз відставав від мови на
# тижні (string interpolation, SHA-пінінг, пісочниця, REPL — усе було
# в NyxilumLang, але не в жодному завантажуваному бінарнику).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create (or reuse) GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Реліз ${{ github.ref_name }} уже існує — продовжуємо (напр. повторний запуск після провалу збірки)"
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            tfm: net10.0-windows
            exe: Nx.exe
            archive_ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            tfm: net10.0
            exe: Nx
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-x64
            tfm: net10.0
            exe: Nx
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            tfm: net10.0
            exe: Nx
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout NyxilumNode (install-скрипти, README, GUIDE, LICENSE)
        uses: actions/checkout@v4
        with:
          path: NyxilumNode

      - name: Checkout NyxilumLang (вихідний код мови)
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumLang
          path: NyxilumLang

      - name: Checkout NyxilumDb (залежність NyxilumLang.csproj)
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumDb
          path: NyxilumDb

      - name: Checkout NyxilumIDE (Nx IDE - кладеться в архів як ide/, запуск `nx ide`)
        uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumIDE
          path: NyxilumIDE

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Версія в NyxilumLang.csproj (<Version>) раніше треба було синхронізувати
      # з тегом релізу ВРУЧНУ - і про це щоразу забували, тому `nx --version`
      # показував застарілу версію незалежно від того, який реліз NyxilumNode
      # реально завантажено. Тег ${{ github.ref_name }} (напр. v1.4.0) - єдине
      # реальне джерело версії цього релізу, тож підставляємо його напряму в
      # збірку через -p:Version, а не покладаємось на те, що хтось не забуде
      # оновити csproj.
      - name: Обчислити версію з тегу
        id: version
        # windows-latest без явного shell бере PowerShell (pwsh), а не bash -
        # ${GITHUB_REF_NAME#v} там не працює як обрізання префікса (той самий
        # клас бага, що вже описаний у кроці "Перевірити, що файли релізу..."
        # нижче) - без цього версія на Windows виходила порожньою, і
        # dotnet publish падав з "GetAssemblyVersion... NuGetVersion".
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained single-file
        working-directory: NyxilumLang
        run: >
          dotnet publish src/NyxilumLang -c Release
          -r ${{ matrix.rid }} -f ${{ matrix.tfm }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:EnableWindowsTargeting=true
          -p:DebugType=None
          -p:Version=${{ steps.version.outputs.number }}
          -o ../publish-out

      - name: Package (Windows, zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Copy-Item NyxilumNode/install-nx.ps1 publish-out/
          Copy-Item NyxilumNode/README.md, NyxilumNode/README.uk.md publish-out/
          Copy-Item NyxilumNode/GUIDE.md publish-out/
          Copy-Item NyxilumNode/GUIDE.uk.md publish-out/
          Copy-Item NyxilumNode/LICENSE publish-out/
          # стандартна бібліотека .nx (telegram, postgres, mysql, crypto...) -
          # без неї import "lib/..." працював лише з клоном NyxilumLang
          Copy-Item -Recurse NyxilumLang/lib publish-out/lib
          # Nx IDE: `nx ide` шукає ide/src/ide.nx поруч з nx
          New-Item -ItemType Directory -Path publish-out/ide | Out-Null
          Copy-Item -Recurse NyxilumIDE/src publish-out/ide/src
          Copy-Item -Recurse NyxilumIDE/examples publish-out/ide/examples
          # вбудовані розширення IDE (Anylint)
          Copy-Item -Recurse NyxilumIDE/extensions publish-out/ide/extensions
          # іконка IDE - для ярликів інсталятора
          Copy-Item -Recurse NyxilumIDE/assets publish-out/ide/assets
          Remove-Item -Recurse -Force publish-out/ide/examples/.gen -ErrorAction SilentlyContinue
          Copy-Item NyxilumIDE/README.md, NyxilumIDE/LICENSE, "NyxilumIDE/ПОСІБНИК.md" publish-out/ide/
          Compress-Archive -Path publish-out/* -DestinationPath "Nx-${{ matrix.rid }}.zip"
          "Nx-${{ matrix.rid }}.zip" | Out-File -Encoding utf8 assets.txt

      # Інсталятор-майстер (як у Node.js): Inno Setup, для поточного
      # користувача, ярлик «Nx IDE», nx у PATH, видалення через «Програми».
      - name: Installer (Windows, Inno Setup)
        if: matrix.archive_ext == 'zip'
        # інсталятор не вийшов - архів однаково має потрапити в реліз
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyVersion=${{ steps.version.outputs.number }}" "/DSrcDir=$PWD\publish-out" "/O$PWD" NyxilumNode\installer\nyx.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: код $LASTEXITCODE" }
          "Nx-win-x64-setup.exe" | Out-File -Encoding utf8 -Append assets.txt

      - name: Package (Linux/Mac, tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cp NyxilumNode/install-nx.sh publish-out/
          cp NyxilumNode/README.md NyxilumNode/README.uk.md publish-out/
          cp NyxilumNode/GUIDE.md NyxilumNode/GUIDE.uk.md publish-out/
          cp NyxilumNode/LICENSE publish-out/
          # стандартна бібліотека .nx (telegram, postgres, mysql, crypto...) -
          # без неї import "lib/..." працював лише з клоном NyxilumLang
          cp -r NyxilumLang/lib publish-out/lib
          # Nx IDE: `nx ide` шукає ide/src/ide.nx поруч з nx
          mkdir -p publish-out/ide
          cp -r NyxilumIDE/src NyxilumIDE/examples NyxilumIDE/extensions NyxilumIDE/assets publish-out/ide/
          rm -rf publish-out/ide/examples/.gen
          cp NyxilumIDE/README.md NyxilumIDE/LICENSE NyxilumIDE/ПОСІБНИК.md publish-out/ide/
          chmod +x "publish-out/${{ matrix.exe }}" publish-out/install-nx.sh
          tar -czf "Nx-${{ matrix.rid }}.${{ matrix.archive_ext }}" -C publish-out .
          echo "Nx-${{ matrix.rid }}.${{ matrix.archive_ext }}" > assets.txt

      - name: Installer (Linux, .deb)
        if: matrix.rid == 'linux-x64'
        # інсталятор не вийшов - архів однаково має потрапити в реліз
        continue-on-error: true
        run: |
          bash NyxilumNode/installer/build-deb.sh publish-out "${{ steps.version.outputs.number }}" Nx-linux-x64.deb
          echo "Nx-linux-x64.deb" >> assets.txt

      - name: Installer (macOS, .pkg)
        if: startsWith(matrix.rid, 'osx-')
        # інсталятор не вийшов - архів однаково має потрапити в реліз
        continue-on-error: true
        run: |
          bash NyxilumNode/installer/build-pkg.sh publish-out "${{ steps.version.outputs.number }}" "Nx-${{ matrix.rid }}.pkg"
          echo "Nx-${{ matrix.rid }}.pkg" >> assets.txt

      - name: Upload release asset
        # На windows-latest run: без явного shell: виконується в pwsh, де
        # "\" наприкінці рядка НЕ є продовженням команди (на відміну від
        # bash) — звідси "Missing expression after unary operator '--'".
        # Один рядок команди прибирає залежність від того, яка оболонка
        # активна на конкретному раннері.
        env:
          GH_TOKEN: ${{ github.token }}
        # архів + інсталятор(и) зі списку assets.txt; bash є й на Windows-раннері
        shell: bash
        run: tr -d '\r\357\273\277' < assets.txt | xargs gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber

  sync-docs:
    # README.md/GUIDE.md у самому репозиторії NyxilumNode (те, що видно
    # на сторінці GitHub без завантаження архіву) інакше знову тихо
    # відстає від NyxilumLang вже до наступного релізу — тому
    # синхронізуємо їх автоматично одразу після успішної збірки, а не
    # "коли згадаємо".
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: NyxilumNode

      - uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumLang
          path: NyxilumLang

      - name: Sync GUIDE.md from NyxilumLang
        run: |
          cp NyxilumLang/GUIDE.md NyxilumNode/GUIDE.md
          cp NyxilumLang/GUIDE.uk.md NyxilumNode/GUIDE.uk.md
          sed -i 's/див\. INSTALL\.md/див. README.uk.md/' NyxilumNode/GUIDE.uk.md
          sed -i 's/див\. INSTALL\.md/див. README.md/' NyxilumNode/GUIDE.md

      - name: Commit if changed
        working-directory: NyxilumNode
        env:
          GH_TOKEN: ${{ github.token }}
        # РЕАЛЬНИЙ БАГ, знайдений живцем (реліз v1.5.0, 22.09.2026):
        # checkout цієї job стається НА ПОЧАТКУ job'и, а не одразу перед
        # push - якщо main тим часом посунувся (напр. попередній реліз
        # уже щось запушив своїм sync-docs), `git push origin HEAD:main`
        # падає з "fetch first" (non-fast-forward), і GUIDE.md лишається
        # несинхронізованим МОВЧКИ (уся job позначається failed, але
        # реліз-артефакти з попередніх job уже опубліковані - легко не
        # помітити). Фікс - retry-цикл: fetch+rebase перед КОЖНОЮ спробою
        # push, а не одна спроба наосліп.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- GUIDE.md GUIDE.uk.md; then
            echo "GUIDE.md і GUIDE.uk.md уже актуальні — коміт не потрібен"
            exit 0
          fi
          git add GUIDE.md GUIDE.uk.md
          git commit -m "Автосинхронізація GUIDE.md і GUIDE.uk.md з NyxilumLang (реліз ${{ github.ref_name }})"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push #$attempt відхилено (main посунувся) - fetch+rebase і пробуємо ще раз"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::не вдалося запушити GUIDE.md після 5 спроб"
          exit 1
